name: Deploy Preview
# Intentionally manual and non-deploying until an approved hosting target,
# deployment credentials, and preview acceptance checks exist.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-not-configured:
    name: Preview deployment not configured
    runs-on: ubuntu-latest
    steps:
      - run: echo "Preview deployments are disabled pending approved hosting configuration."
